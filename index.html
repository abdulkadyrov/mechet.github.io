<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Словесные часы — круг по краям</title>
  <style>
    :root{
      --bg:#070A14;
      --text:#F3F6FF;
      --muted:rgba(243,246,255,.72);
      --border:rgba(255,255,255,.12);
      --shadow: 0 14px 36px rgba(0,0,0,.45);
      --r: 18px;

      --topH: 64px;
      --bottomH: 84px;

      --gap: 10px;
      --pad: 12px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(900px 700px at 20% 10%, rgba(124,92,255,.18), transparent 60%),
        radial-gradient(900px 700px at 80% 30%, rgba(47,224,123,.10), transparent 60%),
        var(--bg);
      color:var(--text);
      -webkit-tap-highlight-color: transparent;
      font-weight: 900;
      overflow:hidden;
    }

    .screen{
      position:fixed;
      inset:0;
      display:grid;
      grid-template-rows: var(--topH) 1fr var(--bottomH);
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    /* top */
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      min-width:0;
    }
    .topLeft{min-width:0; display:flex; flex-direction:column; gap:6px;}
    .title{
      font-size:14px;
      letter-spacing:.2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .hint{
      font-size:12px;
      color:var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .pill{
      border:1px solid var(--border);
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      padding: 8px 10px;
      font-size:12px;
      font-weight: 950;
      white-space:nowrap;
      box-shadow: 0 10px 22px rgba(0,0,0,.25);
      flex:0 0 auto;
    }

    /* arena */
    .arena{
      position:relative;
      padding: var(--pad);
      min-height:0;
    }

    /* “Кольцо”: верх 2 карточки, низ 2 карточки, слева/справа по 2 вертикальные */
    .ring{
      position:absolute;
      inset: var(--pad);
      display:grid;
      gap: var(--gap);
      grid-template-columns: 1fr 1.25fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      align-items:stretch;
    }

    /* центр */
    .center{
      grid-column: 2;
      grid-row: 2;
      border-radius: 24px;
      border:1px dashed rgba(255,255,255,.16);
      background: rgba(255,255,255,.03);
      display:grid;
      place-items:center;
      text-align:center;
      padding: 12px;
    }
    .centerTitle{
      font-size: 12px;
      letter-spacing:.35px;
      text-transform:uppercase;
      color: var(--muted);
      font-weight: 950;
      margin-bottom:6px;
    }
    .centerTurn{
      font-size: 18px;
      font-weight: 950;
      line-height:1.15;
      word-break: break-word;
    }

    .stackRight{
      grid-column:3;
      grid-row:2 / 4;
      display:grid;
      gap: var(--gap);
      grid-template-rows: 1fr 1fr;
      min-height:0;
    }
    .stackLeft{
      grid-column:1;
      grid-row:2 / 4;
      display:grid;
      gap: var(--gap);
      grid-template-rows: 1fr 1fr;
      min-height:0;
    }

    /* cards */
    .player{
      border-radius: var(--r);
      border:1px solid rgba(255,255,255,.14);
      box-shadow: var(--shadow);
      overflow:hidden;
      cursor:pointer;
      user-select:none;
      position:relative;
      display:grid;
      place-items:center;
      min-height:0;
      transition: filter .12s ease, transform .12s ease, outline-color .12s ease;
    }
    .player::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(140px 140px at 20% 15%, rgba(255,255,255,.26), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,0));
      mix-blend-mode: overlay;
      opacity:.60;
      pointer-events:none;
    }

    .inner{
      position:relative;
      width:100%;
      height:100%;
      padding: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }
    .nm{
      font-size: 14px;
      font-weight: 950;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 55%;
      text-transform: uppercase;
      letter-spacing:.25px;
    }
    .tm{
      font-variant-numeric: tabular-nums;
      font-size: clamp(22px, 4.6vw, 34px);
      font-weight: 950;
      letter-spacing:.6px;
      white-space:nowrap;
    }
    .sub{
      position:absolute;
      bottom: 10px;
      left: 12px;
      right: 12px;
      text-align:center;
      font-size: 12px;
      font-weight: 950;
      opacity:.92;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .rot180 .inner{ transform: rotate(180deg); }
    .rot90  .inner{ transform: rotate(90deg); }
    .rot270 .inner{ transform: rotate(270deg); }

    /* Активный + затемнение остальных */
    .ring.hasActive .player{
      filter: brightness(.62) saturate(.7);
    }
    .ring.hasActive .player::after{
      content:"";
      position:absolute;
      inset:0;
      background: rgba(0,0,0,.35);
      pointer-events:none;
    }
    .ring.hasActive .player.active{
      filter:none;
      outline: 5px solid rgba(255,255,255,.78);
      outline-offset: -5px;
      transform: translateY(-1px);
    }
    .ring.hasActive .player.active::after{ background: rgba(0,0,0,0); }

    .player.lost{
      opacity:.78;
      cursor:not-allowed;
      filter: grayscale(.2) brightness(.55);
    }
    .player.lost::after{ background: rgba(0,0,0,.45) !important; }

    /* placements */
    .topL{ grid-column:1; grid-row:1; }
    .topR{ grid-column:3; grid-row:1; }
    .botL{ grid-column:1; grid-row:3; }
    .botR{ grid-column:3; grid-row:3; }

    /* bottom */
    .bottom{
      padding: 8px 12px 12px;
      border-top: 1px solid rgba(255,255,255,.06);
      background: rgba(5,7,16,.40);
      backdrop-filter: blur(8px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .btnRow{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      color: var(--text);
      padding:11px 12px;
      border-radius: 14px;
      cursor:pointer;
      font-weight: 950;
      line-height:1;
      white-space:nowrap;
      min-width: 108px;
      text-align:center;
    }
    .btn:disabled{opacity:.55; cursor:not-allowed}
    .btn.primary{
      background: linear-gradient(180deg, rgba(124,92,255,1), rgba(124,92,255,.72));
      border-color: rgba(124,92,255,.55);
    }
    .btn.danger{
      background: rgba(255,92,122,.14);
      border-color: rgba(255,92,122,.40);
    }
    .btn.ghost{
      min-width: 132px;
      background: rgba(255,255,255,.06);
    }

    /* sheet */
    .sheetOverlay{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.45);
      opacity:0;
      pointer-events:none;
      transition: opacity .18s ease;
    }
    .sheetOverlay.open{ opacity:1; pointer-events:auto; }
    .sheet{
      position:fixed;
      left:0; right:0;
      bottom:0;
      transform: translateY(105%);
      transition: transform .22s ease;
      padding:
        10px
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
    }
    .sheet.open{ transform: translateY(0); }
    .sheetCard{
      border-radius: 20px;
      border:1px solid var(--border);
      background: rgba(10,14,28,.92);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      max-height: 78vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .sheetHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      border-bottom:1px solid rgba(255,255,255,.08);
      flex:0 0 auto;
    }
    .sheetTitle{ font-size:14px; font-weight: 950; letter-spacing:.2px; }
    .sheetClose{ min-width: 96px; }
    .sheetBody{
      padding: 12px;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
    }
    .row{ display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .label{ font-size:12px; font-weight: 950; color: var(--muted); }
    select, input[type="range"], input[type="text"]{
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding:10px 10px;
      font-weight: 950;
      outline:none;
    }
    .timePick{display:flex; gap:8px; align-items:center}
    .counter{display:flex; gap:8px; align-items:center}
    .miniBtn{ min-width: 44px; padding: 10px 0; }
    .names{ display:grid; gap:10px; margin-top: 8px; }
    .nameRow{
      display:grid;
      grid-template-columns: 1fr;
      gap:6px;
      padding: 10px;
      border:1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      background: rgba(255,255,255,.04);
    }
    .note{ color: var(--muted); font-size:12px; font-weight: 900; line-height:1.3; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="top">
      <div class="topLeft">
        <div class="title">Словесные часы</div>
        <div class="hint" id="hintTop">⚙ Настройки → Старт → нажми игрока: ход к следующему по кругу</div>
      </div>
      <div class="pill" id="status">Готово</div>
    </div>

    <div class="arena">
      <div class="ring" id="ring">
        <!-- top (2) -->
        <div class="player rot180 topL" id="host-topL"></div>
        <div class="player rot180 topR" id="host-topR"></div>

        <!-- left/right stacks (2+2) -->
        <div class="stackLeft" id="stackLeft"></div>
        <div class="stackRight" id="stackRight"></div>

        <!-- bottom (2) -->
        <div class="player botL" id="host-botL"></div>
        <div class="player botR" id="host-botR"></div>

        <div class="center">
          <div class="centerTitle">Ход</div>
          <div class="centerTurn" id="centerTurn">—</div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <div class="btnRow">
        <button class="btn primary" id="startBtn">Старт</button>
        <button class="btn" id="pauseBtn" disabled>Пауза</button>
        <button class="btn" id="resumeBtn" disabled>Продолжить</button>
        <button class="btn danger" id="resetBtn">Сброс</button>
      </div>
      <div class="btnRow">
        <button class="btn ghost" id="settingsBtn">⚙ Настройки</button>
      </div>
    </div>
  </div>

  <!-- Settings sheet -->
  <div class="sheetOverlay" id="overlay"></div>
  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheetCard" role="dialog" aria-modal="true">
      <div class="sheetHead">
        <div class="sheetTitle">Настройки</div>
        <button class="btn sheetClose" id="closeSettingsBtn">Закрыть</button>
      </div>

      <div class="sheetBody">
        <div class="row">
          <div class="label">Время на игрока</div>
          <div class="timePick">
            <select id="mm"></select>
            <div class="label">:</div>
            <select id="ss"></select>
          </div>
        </div>

        <div class="row" style="margin-top:10px;">
          <div class="label">Игроков (2/4/6/8)</div>
          <div class="counter">
            <button class="btn miniBtn" id="minusBtn">−</button>
            <div class="pill"><b id="playersCount">8</b></div>
            <button class="btn miniBtn" id="plusBtn">+</button>
          </div>
        </div>

        <div class="row">
          <input id="playersRange" type="range" min="2" max="8" step="2" value="8" style="width:100%"/>
        </div>

        <div class="label" style="margin-top:10px;">Имена игроков</div>
        <div class="names" id="namesBox"></div>

        <div class="note" id="settingsNote" style="margin-top:10px;">
          Настройки можно менять до нажатия «Старт». После старта — «Сброс», чтобы изменить.
        </div>
      </div>
    </div>
  </div>

  <script>
    const pad2 = (n) => String(n).padStart(2, "0");
    const msToText = (ms) => {
      ms = Math.max(0, ms);
      const total = Math.ceil(ms / 1000);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${pad2(m)}:${pad2(s)}`;
    };

    const COLORS = [
      { bg1:"#6D5CFF", bg2:"#4A33FF" },
      { bg1:"#2FE07B", bg2:"#16B85E" },
      { bg1:"#00C2FF", bg2:"#007CFF" },
      { bg1:"#FFB020", bg2:"#FF7A00" },
      { bg1:"#FF5C7A", bg2:"#E52B54" },
      { bg1:"#A855F7", bg2:"#6D28D9" },
      { bg1:"#22D3EE", bg2:"#0891B2" },
      { bg1:"#FDE047", bg2:"#F59E0B" },
    ];

    // Порядок хода по кругу (как вокруг “стола”):
    // topL -> topR -> rightTop -> rightBottom -> botR -> botL -> leftBottom -> leftTop -> (назад)
    const ORDER_8 = [0,1,2,3,4,5,6,7];
    const ORDER_6 = [0,1,2,3,4,5];
    const ORDER_4 = [0,1,2,3];
    const ORDER_2 = [0,1];

    function orderFor(n){
      if (n === 2) return ORDER_2;
      if (n === 4) return ORDER_4;
      if (n === 6) return ORDER_6;
      return ORDER_8;
    }

    // DOM
    const ringEl = document.getElementById("ring");
    const stackLeft = document.getElementById("stackLeft");
    const stackRight = document.getElementById("stackRight");
    const centerTurn = document.getElementById("centerTurn");

    const hintTop = document.getElementById("hintTop");
    const statusEl = document.getElementById("status");

    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resumeBtn = document.getElementById("resumeBtn");
    const resetBtn = document.getElementById("resetBtn");

    const settingsBtn = document.getElementById("settingsBtn");
    const closeSettingsBtn = document.getElementById("closeSettingsBtn");
    const overlay = document.getElementById("overlay");
    const sheet = document.getElementById("sheet");

    const mm = document.getElementById("mm");
    const ss = document.getElementById("ss");
    const minusBtn = document.getElementById("minusBtn");
    const plusBtn = document.getElementById("plusBtn");
    const playersRange = document.getElementById("playersRange");
    const playersCount = document.getElementById("playersCount");
    const namesBox = document.getElementById("namesBox");
    const settingsNote = document.getElementById("settingsNote");

    function fillSelect(select, max){
      select.innerHTML = "";
      for (let i=0;i<=max;i++){
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = pad2(i);
        select.appendChild(opt);
      }
    }
    fillSelect(mm, 59);
    fillSelect(ss, 59);

    const state = {
      n: 8,
      baseMs: 30_000,
      times: [],
      names: [],
      active: -1,
      started: false,
      running: false,
      paused: true,
      lastTs: 0,
      finished: new Set(),
      order: orderFor(8),
    };

    function getPickedMs(){
      const m = parseInt(mm.value, 10);
      const s = parseInt(ss.value, 10);
      let ms = (m*60 + s) * 1000;
      if (ms <= 0) ms = 30_000;
      return ms;
    }
    function setPicked(ms){
      const total = Math.round(ms / 1000);
      mm.value = String(Math.floor(total/60));
      ss.value = String(total%60);
    }

    function currentTurnName(){
      if (!state.running || state.paused || state.active < 0) return "—";
      return state.names[state.active] || `Игрок ${state.active+1}`;
    }

    function setStatusText(){
      if (!state.started){
        statusEl.textContent = "Готово";
        hintTop.textContent = "⚙ Настройки → Старт → нажми игрока: ход по кругу";
      } else if (!state.running){
        statusEl.textContent = "Ожидание";
        hintTop.textContent = "Нажми игрока → ход перейдёт к следующему по кругу";
      } else if (state.paused){
        statusEl.textContent = "Пауза";
        hintTop.textContent = "Пауза";
      } else {
        statusEl.textContent = "Идёт";
        hintTop.textContent = "Нажми игрока → ход к следующему по кругу";
      }
      centerTurn.textContent = currentTurnName();
    }

    function updateButtons(){
      startBtn.disabled = state.started;
      pauseBtn.disabled = !state.running || state.paused;
      resumeBtn.disabled = !state.running || !state.paused;
    }

    function updateSettingsLock(){
      const locked = state.started;
      mm.disabled = locked;
      ss.disabled = locked;
      minusBtn.disabled = locked;
      plusBtn.disabled = locked;
      playersRange.disabled = locked;
      [...namesBox.querySelectorAll("input")].forEach(inp => inp.disabled = locked);
      settingsNote.textContent = locked
        ? "Настройки заблокированы (раунд начат). Нажми «Сброс», чтобы снова менять."
        : "Можно менять время/игроков/имена. Нажми «Старт», затем нажми игрока.";
    }

    function buildNamesEditor(){
      namesBox.innerHTML = "";
      for (let i=0;i<state.n;i++){
        const row = document.createElement("div");
        row.className = "nameRow";

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = `Игрок ${i+1}`;

        const inp = document.createElement("input");
        inp.type = "text";
        inp.placeholder = `Имя игрока ${i+1}`;
        inp.value = state.names[i] ?? `Игрок ${i+1}`;
        inp.addEventListener("input", () => {
          state.names[i] = inp.value.trim() || `Игрок ${i+1}`;
          const nm = document.getElementById(`nm-${i}`);
          if (nm) nm.textContent = state.names[i];
          setStatusText();
        });

        row.appendChild(label);
        row.appendChild(inp);
        namesBox.appendChild(row);
      }
    }

    function makeCard(i, extraClass=""){
      const c = COLORS[i % COLORS.length];
      const card = document.createElement("div");
      card.className = `player ${extraClass}`.trim();
      card.dataset.i = String(i);
      card.style.background = `linear-gradient(180deg, ${c.bg1}, ${c.bg2})`;

      const inner = document.createElement("div");
      inner.className = "inner";

      const name = document.createElement("div");
      name.className = "nm";
      name.id = `nm-${i}`;
      name.textContent = state.names[i] ?? `Игрок ${i+1}`;

      const time = document.createElement("div");
      time.className = "tm";
      time.id = `tm-${i}`;
      time.textContent = msToText(state.times[i]);

      const sub = document.createElement("div");
      sub.className = "sub";
      sub.id = `sub-${i}`;
      sub.textContent = "Нажми";

      inner.appendChild(name);
      inner.appendChild(time);
      card.appendChild(inner);
      card.appendChild(sub);

      card.addEventListener("click", () => onTap(i));
      return card;
    }

    function clearHosts(){
      const hosts = ["host-topL","host-topR","host-botL","host-botR"];
      for (const id of hosts){
        const el = document.getElementById(id);
        el.dataset.i = "";
        el.style.background = "";
        el.innerHTML = "";
        // возвращаем базовый класс (ориентация сохраняется у top)
        if (id === "host-topL" || id === "host-topR") el.className = "player rot180 " + (id==="host-topL"?"topL":"topR");
        if (id === "host-botL") el.className = "player botL";
        if (id === "host-botR") el.className = "player botR";
      }
      stackLeft.innerHTML = "";
      stackRight.innerHTML = "";
      ringEl.classList.remove("hasActive");
    }

    function mountIntoHost(hostId, card){
      const host = document.getElementById(hostId);
      host.dataset.i = card.dataset.i;
      host.style.background = card.style.background;
      host.innerHTML = card.innerHTML;
      // восстановим обработчик
      host.onclick = null;
      host.addEventListener("click", () => onTap(parseInt(card.dataset.i, 10)));
      // подпись “sub” уже внутри, ок
    }

    function buildLayout(){
      clearHosts();
      state.order = orderFor(state.n);

      // top: 0,1 всегда
      if (state.n >= 1) mountIntoHost("host-topL", makeCard(0));
      if (state.n >= 2) mountIntoHost("host-topR", makeCard(1));

      // right stack: 2,3 (если есть)
      if (state.n >= 3) stackRight.appendChild(makeCard(2, "rot270"));
      if (state.n >= 4) stackRight.appendChild(makeCard(3, "rot270"));

      // bottom: 4,5 (если есть)
      if (state.n >= 5) mountIntoHost("host-botR", makeCard(4));
      if (state.n >= 6) mountIntoHost("host-botL", makeCard(5));

      // left stack: 6,7 (если есть) — верхний это 7, нижний 6
      if (state.n >= 8){
        stackLeft.appendChild(makeCard(7, "rot90"));
        stackLeft.appendChild(makeCard(6, "rot90"));
      } else if (state.n >= 7){
        stackLeft.appendChild(makeCard(6, "rot90"));
      }

      renderAll();
    }

    function renderAll(){
      const allCards = [
        ...ringEl.querySelectorAll(".player"),
        ...stackLeft.querySelectorAll(".player"),
        ...stackRight.querySelectorAll(".player")
      ];

      const hasActive = state.running && !state.paused && state.active >= 0;
      ringEl.classList.toggle("hasActive", hasActive);

      allCards.forEach(el => {
        const i = parseInt(el.dataset.i || "-1", 10);
        el.classList.toggle("active", hasActive && i === state.active);
        el.classList.toggle("lost", i >= 0 && state.finished.has(i));
      });

      for (let i=0;i<state.n;i++){
        const tEl = document.getElementById(`tm-${i}`);
        if (tEl) tEl.textContent = msToText(state.times[i]);

        const sEl = document.getElementById(`sub-${i}`);
        if (!sEl) continue;

        if (state.finished.has(i)) sEl.textContent = "Вышло";
        else if (!state.started) sEl.textContent = "После Старт";
        else if (!state.running) sEl.textContent = "Нажми → ход по кругу";
        else if (state.paused) sEl.textContent = "Пауза";
        else sEl.textContent = (i === state.active) ? "Сейчас идёт" : "Нажми → ход по кругу";
      }

      playersCount.textContent = String(state.n);
      playersRange.value = String(state.n);

      setStatusText();
      updateButtons();
      updateSettingsLock();
    }

    function nextAliveFrom(i){
      const order = state.order;
      const pos = order.indexOf(i);
      if (pos === -1) return i;

      for (let step=1; step<=order.length; step++){
        const cand = order[(pos + step) % order.length];
        if (!state.finished.has(cand)) return cand;
      }
      return i;
    }

    // Нажал игрок i -> ход к следующему по кругу
    function onTap(i){
      if (!state.started) return;
      if (state.running && state.paused) return;
      if (state.finished.size >= state.n) return;
      if (state.finished.has(i)) return;

      const next = nextAliveFrom(i);

      if (!state.running){
        state.running = true;
        state.paused = false;
        state.lastTs = performance.now();
      }
      state.active = next;
      renderAll();
    }

    function start(){
      if (state.started) return;

      state.baseMs = getPickedMs();
      state.times = Array.from({length: state.n}, () => state.baseMs);
      state.finished = new Set();
      state.active = -1;

      state.started = true;
      state.running = false; // старт не запускает тик
      state.paused = true;
      state.lastTs = 0;

      renderAll();
    }

    function pause(){
      if (!state.running) return;
      state.paused = true;
      renderAll();
    }

    function resume(){
      if (!state.running) return;
      state.paused = false;
      state.lastTs = performance.now();
      renderAll();
    }

    function resetAll(){
      state.baseMs = getPickedMs();
      state.times = Array.from({length: state.n}, () => state.baseMs);
      state.finished = new Set();
      state.active = -1;

      state.started = false;
      state.running = false;
      state.paused = true;
      state.lastTs = 0;

      buildNamesEditor();
      buildLayout();
      renderAll();
    }

    function normalizePlayers(n){
      n = Math.max(2, Math.min(8, n));
      // только 2/4/6/8
      if (n % 2 !== 0) n += 1;
      if (n === 3) n = 4;
      if (n === 5) n = 6;
      if (n === 7) n = 8;
      return n;
    }

    function setPlayersCount(n){
      if (state.started) return;
      state.n = normalizePlayers(n);

      state.baseMs = getPickedMs();
      state.times = Array.from({length: state.n}, () => state.baseMs);

      const newNames = [];
      for (let i=0;i<state.n;i++){
        newNames[i] = state.names[i] ?? `Игрок ${i+1}`;
      }
      state.names = newNames;

      buildNamesEditor();
      buildLayout();
    }

    function addPlayer(){ setPlayersCount(state.n + 2); }
    function removePlayer(){ setPlayersCount(state.n - 2); }

    function onTimeChange(){
      if (state.started) return;
      state.baseMs = getPickedMs();
      state.times = Array.from({length: state.n}, () => state.baseMs);
      buildLayout();
      renderAll();
    }

    function tick(ts){
      if (!state.running || state.paused || state.active < 0){
        state.lastTs = ts;
        requestAnimationFrame(tick);
        return;
      }

      const dt = ts - (state.lastTs || ts);
      state.lastTs = ts;

      if (!state.finished.has(state.active)){
        state.times[state.active] -= dt;

        if (state.times[state.active] <= 0){
          state.times[state.active] = 0;
          state.finished.add(state.active);

          if (state.finished.size < state.n){
            state.active = nextAliveFrom(state.active);
          }
          renderAll();
        } else {
          const tEl = document.getElementById(`tm-${state.active}`);
          if (tEl) tEl.textContent = msToText(state.times[state.active]);
          centerTurn.textContent = currentTurnName();
        }
      }

      requestAnimationFrame(tick);
    }

    // settings sheet
    function openSettings(){
      overlay.classList.add("open");
      sheet.classList.add("open");
      sheet.setAttribute("aria-hidden", "false");
      updateSettingsLock();
    }
    function closeSettings(){
      overlay.classList.remove("open");
      sheet.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
    }

    settingsBtn.addEventListener("click", openSettings);
    closeSettingsBtn.addEventListener("click", closeSettings);
    overlay.addEventListener("click", closeSettings);

    mm.addEventListener("change", onTimeChange);
    ss.addEventListener("change", onTimeChange);

    plusBtn.addEventListener("click", addPlayer);
    minusBtn.addEventListener("click", removePlayer);
    playersRange.addEventListener("input", () => setPlayersCount(parseInt(playersRange.value, 10)));

    startBtn.addEventListener("click", start);
    pauseBtn.addEventListener("click", pause);
    resumeBtn.addEventListener("click", resume);
    resetBtn.addEventListener("click", resetAll);

    // init
    setPicked(30_000);
    state.baseMs = getPickedMs();
    state.times = Array.from({length: state.n}, () => state.baseMs);
    state.names = Array.from({length: state.n}, (_, i) => `Игрок ${i+1}`);

    buildNamesEditor();
    buildLayout();
    renderAll();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
