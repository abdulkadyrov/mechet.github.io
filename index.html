<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Словесные часы</title>
  <style>
    :root{
      --bg:#070A14;
      --text:#F3F6FF;
      --muted:rgba(243,246,255,.72);
      --border:rgba(255,255,255,.12);
      --shadow: 0 14px 36px rgba(0,0,0,.45);

      --topH: 64px;
      --bottomH: 92px;

      --pad: 12px;
      --gap: 12px;
      --r: 22px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    html,body{overflow:hidden}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(900px 700px at 20% 10%, rgba(124,92,255,.18), transparent 60%),
        radial-gradient(900px 700px at 80% 30%, rgba(47,224,123,.10), transparent 60%),
        var(--bg);
      color:var(--text);
      font-weight: 900;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .screen{
      position:fixed;
      inset:0;
      display:grid;
      grid-template-rows: var(--topH) 1fr var(--bottomH);
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      background: rgba(7,10,20,.72);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.06);
      min-width:0;
    }
    .topLeft{min-width:0; display:flex; flex-direction:column; gap:6px;}
    .title{font-size:14px; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .hint{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .pill{
      border:1px solid var(--border);
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      padding: 8px 10px;
      font-size:12px;
      font-weight: 950;
      white-space:nowrap;
      box-shadow: 0 10px 22px rgba(0,0,0,.25);
      flex:0 0 auto;
    }

    .arena{
      padding: var(--pad);
      min-height:0;
      display:grid;
      place-items:stretch;
    }

    .ring{
      width:100%;
      height:100%;
      display:grid;
      gap: var(--gap);
      grid-template-columns: 1.25fr 1fr 1fr 1.25fr;
      grid-template-rows: 1fr 1fr 1fr 1fr;
      min-height:0;
    }
    .centerEmpty{
      grid-column: 2 / 4;
      grid-row: 2 / 4;
      border-radius: 26px;
      border:1px dashed rgba(255,255,255,.10);
      background: rgba(255,255,255,.02);
    }

    .slot{ display:none; min-height:0; }

    /* ======= LAYOUTS n=2..8 (как ты просил) ======= */

    /* 8 */
    .ring.n8 .slot-8{ grid-column: 1 / 3; grid-row: 1; }
    .ring.n8 .slot-2{ grid-column: 3 / 5; grid-row: 1; }
    .ring.n8 .slot-4{ grid-column: 1; grid-row: 2; }
    .ring.n8 .slot-5{ grid-column: 1; grid-row: 3; }
    .ring.n8 .slot-3{ grid-column: 4; grid-row: 2; }
    .ring.n8 .slot-6{ grid-column: 4; grid-row: 3; }
    .ring.n8 .slot-7{ grid-column: 1 / 3; grid-row: 4; }
    .ring.n8 .slot-1{ grid-column: 3 / 5; grid-row: 4; }

    /* 7: 7 как 2 (верх, rot180), 1 внизу широкий */
    .ring.n7 .slot-7{ grid-column: 1 / 3; grid-row: 1; }
    .ring.n7 .slot-2{ grid-column: 3 / 5; grid-row: 1; }
    .ring.n7 .slot-5{ grid-column: 1; grid-row: 2; }
    .ring.n7 .slot-4{ grid-column: 1; grid-row: 3; }
    .ring.n7 .slot-3{ grid-column: 4; grid-row: 2; }
    .ring.n7 .slot-6{ grid-column: 4; grid-row: 3; }
    .ring.n7 .slot-1{ grid-column: 1 / 5; grid-row: 4; }

    /* 6: 1 и 2 по ширине большие */
    .ring.n6 .slot-2{ grid-column: 1 / 5; grid-row: 1; }
    .ring.n6 .slot-5{ grid-column: 1; grid-row: 2; }
    .ring.n6 .slot-4{ grid-column: 1; grid-row: 3; }
    .ring.n6 .slot-3{ grid-column: 4; grid-row: 2; }
    .ring.n6 .slot-6{ grid-column: 4; grid-row: 3; }
    .ring.n6 .slot-1{ grid-column: 1 / 5; grid-row: 4; }

    /* 5: 1 и 2 по ширине большие */
    .ring.n5 .slot-2{ grid-column: 1 / 5; grid-row: 1; }
    .ring.n5 .slot-4{ grid-column: 1; grid-row: 2 / 4; }
    .ring.n5 .slot-3{ grid-column: 4; grid-row: 2; }
    .ring.n5 .slot-5{ grid-column: 4; grid-row: 3; }
    .ring.n5 .slot-1{ grid-column: 1 / 5; grid-row: 4; }

    /* 4 */
    .ring.n4 .slot-2{ grid-column: 1 / 5; grid-row: 1; }
    .ring.n4 .slot-4{ grid-column: 1; grid-row: 2 / 4; }
    .ring.n4 .slot-3{ grid-column: 4; grid-row: 2 / 4; }
    .ring.n4 .slot-1{ grid-column: 1 / 5; grid-row: 4; }

    /* 3 */
    .ring.n3 .slot-2{ grid-column: 1 / 5; grid-row: 1; }
    .ring.n3 .slot-3{ grid-column: 4; grid-row: 2 / 4; }
    .ring.n3 .slot-1{ grid-column: 1 / 5; grid-row: 4; }

    /* 2 */
    .ring.n2 .slot-2{ grid-column: 1 / 5; grid-row: 1 / 3; }
    .ring.n2 .slot-1{ grid-column: 1 / 5; grid-row: 3 / 5; }

    /* ======= CARD ======= */
    .player{
      width:100%;
      height:100%;
      border-radius: var(--r);
      border:1px solid rgba(255,255,255,.14);
      box-shadow: var(--shadow);
      overflow:hidden;
      cursor:pointer;
      user-select:none;
      position:relative;
      display:grid;
      place-items:center;
      min-height:0;
      transition: filter .12s ease, transform .12s ease, outline-color .12s ease, opacity .12s ease;
    }
    .player::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(180px 180px at 20% 15%, rgba(255,255,255,.26), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,0));
      mix-blend-mode: overlay;
      opacity:.60;
      pointer-events:none;
    }
    .inner{
      position:relative;
      width:100%;
      height:100%;
      padding: 14px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:10px;
      text-align:center;
    }
    .name{
      font-size: clamp(12px, 2.2vw, 16px);
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing:.25px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 92%;
    }
    .time{
      font-variant-numeric: tabular-nums;
      font-size: clamp(32px, 7.8vw, 64px);
      font-weight: 950;
      letter-spacing:.8px;
      line-height:1;
      white-space:nowrap;
    }
    .sub{
      font-size: clamp(11px, 2.1vw, 14px);
      font-weight: 950;
      opacity:.92;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 92%;
    }

    .rot180 .inner{ transform: rotate(180deg); }
    .rot90  .inner{ transform: rotate(90deg); }
    .rot270 .inner{ transform: rotate(270deg); }

    .ring.hasActive .player{ filter: brightness(.62) saturate(.7); }
    .ring.hasActive .player::after{
      content:"";
      position:absolute;
      inset:0;
      background: rgba(0,0,0,.35);
      pointer-events:none;
    }
    .ring.hasActive .player.active{
      filter:none;
      outline: 6px solid rgba(255,255,255,.80);
      outline-offset: -6px;
      transform: translateY(-1px);
    }
    .ring.hasActive .player.active::after{ background: rgba(0,0,0,0); }

    .player.lost{
      opacity:.78;
      cursor:not-allowed;
      filter: grayscale(.2) brightness(.55);
    }
    .player.lost::after{ background: rgba(0,0,0,.45) !important; }

    .bottom{
      padding: 10px 12px 12px;
      border-top: 1px solid rgba(255,255,255,.06);
      background: rgba(5,7,16,.72);
      backdrop-filter: blur(10px);
    }
    .bottomInner{
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:8px;
      flex-wrap:wrap;
    }
    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      color: var(--text);
      padding:11px 12px;
      border-radius: 14px;
      cursor:pointer;
      font-weight: 950;
      line-height:1;
      white-space:nowrap;
      min-width: 108px;
      text-align:center;
    }
    .btn:disabled{opacity:.55; cursor:not-allowed}
    .btn.primary{
      background: linear-gradient(180deg, rgba(124,92,255,1), rgba(124,92,255,.72));
      border-color: rgba(124,92,255,.55);
    }
    .btn.danger{
      background: rgba(255,92,122,.14);
      border-color: rgba(255,92,122,.40);
    }
    .btn.ghost{
      background: rgba(255,255,255,.06);
      min-width: 132px;
    }

    /* Settings sheet */
    .sheetOverlay{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.45);
      opacity:0;
      pointer-events:none;
      transition: opacity .18s ease;
      z-index: 30;
    }
    .sheetOverlay.open{ opacity:1; pointer-events:auto; }
    .sheet{
      position:fixed;
      left:0; right:0;
      bottom:0;
      transform: translateY(105%);
      transition: transform .22s ease;
      padding:
        10px
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
      z-index: 31;
    }
    .sheet.open{ transform: translateY(0); }
    .sheetCard{
      border-radius: 20px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(10,14,28,.92);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      max-height: 78svh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .sheetHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      border-bottom:1px solid rgba(255,255,255,.08);
      flex:0 0 auto;
    }
    .sheetTitle{ font-size:14px; font-weight: 950; letter-spacing:.2px; }
    .sheetClose{ min-width: 96px; }
    .sheetBody{
      padding: 12px;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
    }
    .row{ display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .label{ font-size:12px; font-weight: 950; color: var(--muted); }
    select, input[type="range"], input[type="text"]{
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding:10px 10px;
      font-weight: 950;
      outline:none;
    }
    .timePick{display:flex; gap:8px; align-items:center}
    .counter{display:flex; gap:8px; align-items:center}
    .miniBtn{ min-width: 44px; padding: 10px 0; }
    .names{ display:grid; gap:10px; margin-top: 8px; }
    .nameRow{
      display:grid;
      grid-template-columns: 1fr;
      gap:6px;
      padding: 10px;
      border:1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      background: rgba(255,255,255,.04);
    }
    .note{ color: var(--muted); font-size:12px; font-weight: 900; line-height:1.3; }

    .quickN{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .chip{
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding:10px 12px;
      border-radius: 999px;
      font-weight: 950;
      cursor:pointer;
      min-width: 44px;
      text-align:center;
    }
    .chip.active{
      border-color: rgba(124,92,255,.60);
      background: rgba(124,92,255,.22);
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="top">
      <div class="topLeft">
        <div class="title">Словесные часы</div>
        <div class="hint" id="hintTop">⚙ Настройки → Старт → нажми игрока: время пойдёт у следующего</div>
      </div>
      <div class="pill" id="status">Готово</div>
    </div>

    <div class="arena">
      <div class="ring n2" id="ring">
        <div class="centerEmpty"></div>

        <div class="slot slot-1" id="slot1"></div>
        <div class="slot slot-2" id="slot2"></div>
        <div class="slot slot-3" id="slot3"></div>
        <div class="slot slot-4" id="slot4"></div>
        <div class="slot slot-5" id="slot5"></div>
        <div class="slot slot-6" id="slot6"></div>
        <div class="slot slot-7" id="slot7"></div>
        <div class="slot slot-8" id="slot8"></div>
      </div>
    </div>

    <div class="bottom">
      <div class="bottomInner">
        <button class="btn primary" id="startBtn">Старт</button>
        <button class="btn" id="pauseBtn" disabled>Пауза</button>
        <button class="btn" id="resumeBtn" disabled>Продолжить</button>
        <button class="btn danger" id="resetBtn">Сброс</button>
        <button class="btn ghost" id="settingsBtn">⚙ Настройки</button>
      </div>
    </div>
  </div>

  <!-- Settings -->
  <div class="sheetOverlay" id="overlay"></div>
  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheetCard" role="dialog" aria-modal="true">
      <div class="sheetHead">
        <div class="sheetTitle">Настройки</div>
        <button class="btn sheetClose" id="closeSettingsBtn">Закрыть</button>
      </div>

      <div class="sheetBody">
        <div class="row">
          <div class="label">Время на игрока</div>
          <div class="timePick">
            <select id="mm"></select>
            <div class="label">:</div>
            <select id="ss"></select>
          </div>
        </div>

        <div class="row" style="margin-top:10px;">
          <div class="label">Игроков (2..8)</div>
          <div class="counter">
            <button class="btn miniBtn" id="minusBtn">−</button>
            <div class="pill"><b id="playersCount">2</b></div>
            <button class="btn miniBtn" id="plusBtn">+</button>
          </div>
        </div>

        <div class="row">
          <input id="playersRange" type="range" min="2" max="8" step="1" value="2" style="width:100%"/>
        </div>

        <div class="label" style="margin-top:10px;">Быстрый выбор раскладки</div>
        <div class="quickN" id="quickN"></div>

        <div class="label" style="margin-top:10px;">Имена игроков</div>
        <div class="names" id="namesBox"></div>

        <div class="note" id="settingsNote" style="margin-top:10px;">
          Настройки можно менять до нажатия «Старт». После старта — «Сброс», чтобы изменить.
        </div>
      </div>
    </div>
  </div>

  <script>
    const pad2 = (n) => String(n).padStart(2, "0");
    const msToText = (ms) => {
      ms = Math.max(0, ms);
      const total = Math.ceil(ms / 1000);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${pad2(m)}:${pad2(s)}`;
    };

    const COLORS = [
      { bg1:"#6D5CFF", bg2:"#4A33FF" },
      { bg1:"#2FE07B", bg2:"#16B85E" },
      { bg1:"#00C2FF", bg2:"#007CFF" },
      { bg1:"#FFB020", bg2:"#FF7A00" },
      { bg1:"#FF5C7A", bg2:"#E52B54" },
      { bg1:"#A855F7", bg2:"#6D28D9" },
      { bg1:"#22D3EE", bg2:"#0891B2" },
      { bg1:"#FDE047", bg2:"#F59E0B" },
    ];

    const TURN_ORDER_BY_N = {
      2: [1,2],
      3: [1,2,3],
      4: [1,4,2,3],
      5: [1,4,2,3,5],
      6: [1,5,4,2,3,6],
      7: [1,5,4,7,2,3,6],
      8: [1,7,5,4,8,2,3,6],
    };

    // DOM
    const ring = document.getElementById("ring");
    const hintTop = document.getElementById("hintTop");
    const statusEl = document.getElementById("status");

    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resumeBtn = document.getElementById("resumeBtn");
    const resetBtn = document.getElementById("resetBtn");

    const settingsBtn = document.getElementById("settingsBtn");
    const closeSettingsBtn = document.getElementById("closeSettingsBtn");
    const overlay = document.getElementById("overlay");
    const sheet = document.getElementById("sheet");

    const mm = document.getElementById("mm");
    const ss = document.getElementById("ss");
    const minusBtn = document.getElementById("minusBtn");
    const plusBtn = document.getElementById("plusBtn");
    const playersRange = document.getElementById("playersRange");
    const playersCount = document.getElementById("playersCount");
    const namesBox = document.getElementById("namesBox");
    const settingsNote = document.getElementById("settingsNote");
    const quickN = document.getElementById("quickN");

    const slots = {
      1: document.getElementById("slot1"),
      2: document.getElementById("slot2"),
      3: document.getElementById("slot3"),
      4: document.getElementById("slot4"),
      5: document.getElementById("slot5"),
      6: document.getElementById("slot6"),
      7: document.getElementById("slot7"),
      8: document.getElementById("slot8"),
    };

    function fillSelect(select, max){
      select.innerHTML = "";
      for (let i=0;i<=max;i++){
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = pad2(i);
        select.appendChild(opt);
      }
    }
    fillSelect(mm, 59);
    fillSelect(ss, 59);

    const state = {
      n: 2,
      baseMs: 30_000,
      times: [],
      names: [],
      active: -1,        // internal index [0..n-1]
      started: false,
      running: false,
      paused: true,
      lastTs: 0,
      finished: new Set(), // set of internal indices
    };

    function getOrder(){
      return TURN_ORDER_BY_N[state.n] || Array.from({length: state.n}, (_,i)=>i+1);
    }
    function indexFromPlayerNum(p){ return p - 1; }
    function playerNumFromIndex(i){ return i + 1; }

    function nextByCustomOrderAfterPlayer(playerNum){
      const order = getOrder();

      // только живые (не выбывшие)
      const alive = order.filter(p => !state.finished.has(indexFromPlayerNum(p)));
      if (alive.length === 0) return -1;

      // если текущий не в alive (например выбыл) — стартуем с первого
      const idx = alive.indexOf(playerNum);
      const nextP = alive[(idx >= 0 ? idx + 1 : 0) % alive.length];
      return indexFromPlayerNum(nextP);
    }

    function getPickedMs(){
      const m = parseInt(mm.value, 10);
      const s = parseInt(ss.value, 10);
      let ms = (m*60 + s) * 1000;
      if (ms <= 0) ms = 30_000;
      return ms;
    }
    function setPicked(ms){
      const total = Math.round(ms / 1000);
      mm.value = String(Math.floor(total/60));
      ss.value = String(total%60);
    }

    function setStatusText(){
      if (!state.started){
        statusEl.textContent = "Готово";
        hintTop.textContent = "⚙ Настройки → Старт → нажми игрока: время пойдёт у следующего";
      } else if (!state.running){
        statusEl.textContent = "Ожидание";
        hintTop.textContent = "Нажми игрока X → пойдёт время у следующего (по кругу)";
      } else if (state.paused){
        statusEl.textContent = "Пауза";
        hintTop.textContent = "Пауза";
      } else {
        statusEl.textContent = "Идёт";
        hintTop.textContent = "Нажми игрока → ход к следующему (по кругу)";
      }
    }

    function updateButtons(){
      startBtn.disabled = state.started;
      pauseBtn.disabled = !state.running || state.paused;
      resumeBtn.disabled = !state.running || !state.paused;
    }

    function updateSettingsLock(){
      const locked = state.started;
      mm.disabled = locked;
      ss.disabled = locked;
      minusBtn.disabled = locked;
      plusBtn.disabled = locked;
      playersRange.disabled = locked;
      [...namesBox.querySelectorAll("input")].forEach(inp => inp.disabled = locked);

      settingsNote.textContent = locked
        ? "Настройки заблокированы (раунд начат). Нажми «Сброс», чтобы снова менять."
        : "Можно менять время/игроков/имена/раскладку. Нажми «Старт», затем нажми игрока.";
    }

    function buildQuickN(){
      quickN.innerHTML = "";
      for (let n=2;n<=8;n++){
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip";
        b.textContent = String(n);
        b.addEventListener("click", () => setPlayersCount(n));
        quickN.appendChild(b);
      }
      setActiveQuickN();
    }
    function setActiveQuickN(){
      [...quickN.querySelectorAll(".chip")].forEach(ch => {
        ch.classList.toggle("active", ch.textContent === String(state.n));
      });
    }

    function buildNamesEditor(){
      namesBox.innerHTML = "";
      for (let i=0;i<state.n;i++){
        const row = document.createElement("div");
        row.className = "nameRow";

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = `Игрок ${i+1}`;

        const inp = document.createElement("input");
        inp.type = "text";
        inp.placeholder = `Имя игрока ${i+1}`;
        inp.value = state.names[i] ?? `Игрок ${i+1}`;
        inp.addEventListener("input", () => {
          state.names[i] = inp.value.trim() || `Игрок ${i+1}`;
          const nameEl = document.getElementById(`name-${i}`);
          if (nameEl) nameEl.textContent = state.names[i];
        });

        row.appendChild(label);
        row.appendChild(inp);
        namesBox.appendChild(row);
      }
    }

    function makeCard(i){
      const c = COLORS[i % COLORS.length];
      const card = document.createElement("div");
      card.className = "player";
      card.dataset.i = String(i);
      card.style.background = `linear-gradient(180deg, ${c.bg1}, ${c.bg2})`;

      const inner = document.createElement("div");
      inner.className = "inner";

      const name = document.createElement("div");
      name.className = "name";
      name.id = `name-${i}`;
      name.textContent = state.names[i] ?? `Игрок ${i+1}`;

      const time = document.createElement("div");
      time.className = "time";
      time.id = `time-${i}`;
      time.textContent = msToText(state.times[i]);

      const sub = document.createElement("div");
      sub.className = "sub";
      sub.id = `sub-${i}`;
      sub.textContent = "Нажми";

      inner.appendChild(name);
      inner.appendChild(time);
      inner.appendChild(sub);
      card.appendChild(inner);

      card.addEventListener("click", () => onTap(i));
      return card;
    }

    // Повороты оставляем как раньше (визуально к центру)
    // 1 normal, 2 rot180, 3 rot270, 4 rot90, 5 rot90, 6 rot270, 7 normal, 8 rot180
    function rotationForPlayer(p){
      if (p === 2 || p === 7 || p === 8) return "rot180"; // 7 сверху в режиме n=7 тоже вверх
      if (p === 3 || p === 6) return "rot270";
      if (p === 4 || p === 5) return "rot90";
      return "";
    }

    function clearSlots(){
      for (let p=1;p<=8;p++){
        const s = slots[p];
        s.style.display = "none";
        s.innerHTML = "";
      }
      ring.classList.remove("hasActive");
    }

    function applyLayoutClass(){
      ring.classList.remove("n2","n3","n4","n5","n6","n7","n8");
      ring.classList.add(`n${state.n}`);
    }

    function buildLayout(){
      clearSlots();
      applyLayoutClass();

      for (let p=1; p<=state.n; p++){
        const i = p - 1;
        const slot = slots[p];
        const card = makeCard(i);
        const rot = rotationForPlayer(p);
        if (rot) card.classList.add(rot);
        slot.style.display = "block";
        slot.appendChild(card);
      }

      setActiveQuickN();
      renderAll();
    }

    function renderAll(){
      const cards = [...ring.querySelectorAll(".player")];
      const hasActive = state.running && !state.paused && state.active >= 0;
      ring.classList.toggle("hasActive", hasActive);

      cards.forEach(el => {
        const i = parseInt(el.dataset.i, 10);
        el.classList.toggle("active", hasActive && i === state.active);
        el.classList.toggle("lost", state.finished.has(i));
      });

      for (let i=0;i<state.n;i++){
        const tEl = document.getElementById(`time-${i}`);
        if (tEl) tEl.textContent = msToText(state.times[i]);

        const sEl = document.getElementById(`sub-${i}`);
        if (!sEl) continue;

        if (state.finished.has(i)) sEl.textContent = "Вышло";
        else if (!state.started) sEl.textContent = "После Старт";
        else if (!state.running) sEl.textContent = "Нажми → ход следующему";
        else if (state.paused) sEl.textContent = "Пауза";
        else sEl.textContent = (i === state.active) ? "Сейчас идёт" : "Нажми → ход следующему";
      }

      playersCount.textContent = String(state.n);
      playersRange.value = String(state.n);

      setStatusText();
      updateButtons();
      updateSettingsLock();
    }

    // Нажал игрока i -> ходит следующий по КАСТОМНОМУ порядку для текущего n
    function onTap(i){
      if (!state.started) return;
      if (state.running && state.paused) return;
      if (state.finished.size >= state.n) return;
      if (state.finished.has(i)) return;

      const currentP = playerNumFromIndex(i);
      const nextIndex = nextByCustomOrderAfterPlayer(currentP);
      if (nextIndex < 0) return;

      if (!state.running){
        state.running = true;
        state.paused = false;
        state.lastTs = performance.now();
      }
      state.active = nextIndex;
      renderAll();
    }

    function start(){
      if (state.started) return;

      state.baseMs = getPickedMs();
      state.times = Array.from({length: state.n}, () => state.baseMs);
      state.finished = new Set();
      state.active = -1;

      state.started = true;
      state.running = false;
      state.paused = true;
      state.lastTs = 0;

      renderAll();
    }

    function pause(){
      if (!state.running) return;
      state.paused = true;
      renderAll();
    }

    function resume(){
      if (!state.running) return;
      state.paused = false;
      state.lastTs = performance.now();
      renderAll();
    }

    function resetAll(){
      state.baseMs = getPickedMs();
      state.times = Array.from({length: state.n}, () => state.baseMs);
      state.finished = new Set();
      state.active = -1;

      state.started = false;
      state.running = false;
      state.paused = true;
      state.lastTs = 0;

      buildNamesEditor();
      buildLayout();
      renderAll();
    }

    function setPlayersCount(n){
      if (state.started) return;
      state.n = Math.max(2, Math.min(8, n));
      state.baseMs = getPickedMs();
      state.times = Array.from({length: state.n}, () => state.baseMs);

      const newNames = [];
      for (let i=0;i<state.n;i++){
        newNames[i] = state.names[i] ?? `Игрок ${i+1}`;
      }
      state.names = newNames;

      buildNamesEditor();
      buildLayout();
    }

    function addPlayer(){ setPlayersCount(state.n + 1); }
    function removePlayer(){ setPlayersCount(state.n - 1); }

    function onTimeChange(){
      if (state.started) return;
      state.baseMs = getPickedMs();
      state.times = Array.from({length: state.n}, () => state.baseMs);
      buildLayout();
      renderAll();
    }

    function tick(ts){
      if (!state.running || state.paused || state.active < 0){
        state.lastTs = ts;
        requestAnimationFrame(tick);
        return;
      }

      const dt = ts - (state.lastTs || ts);
      state.lastTs = ts;

      if (!state.finished.has(state.active)){
        state.times[state.active] -= dt;

        if (state.times[state.active] <= 0){
          state.times[state.active] = 0;
          state.finished.add(state.active);

          // если кто-то ещё жив — передаём ход следующему по порядку
          if (state.finished.size < state.n){
            const currentP = playerNumFromIndex(state.active);
            const nextIndex = nextByCustomOrderAfterPlayer(currentP);
            state.active = nextIndex;
          } else {
            state.active = -1;
            state.running = false;
            state.paused = true;
          }

          renderAll();
        } else {
          const tEl = document.getElementById(`time-${state.active}`);
          if (tEl) tEl.textContent = msToText(state.times[state.active]);
        }
      }

      requestAnimationFrame(tick);
    }

    function openSettings(){
      overlay.classList.add("open");
      sheet.classList.add("open");
      sheet.setAttribute("aria-hidden", "false");
      updateSettingsLock();
    }
    function closeSettings(){
      overlay.classList.remove("open");
      sheet.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
    }

    // Events
    startBtn.addEventListener("click", start);
    pauseBtn.addEventListener("click", pause);
    resumeBtn.addEventListener("click", resume);
    resetBtn.addEventListener("click", resetAll);

    settingsBtn.addEventListener("click", openSettings);
    closeSettingsBtn.addEventListener("click", closeSettings);
    overlay.addEventListener("click", closeSettings);

    mm.addEventListener("change", onTimeChange);
    ss.addEventListener("change", onTimeChange);

    plusBtn.addEventListener("click", addPlayer);
    minusBtn.addEventListener("click", removePlayer);
    playersRange.addEventListener("input", () => setPlayersCount(parseInt(playersRange.value, 10)));

    // Init
    buildQuickN();
    setPicked(30_000);
    state.baseMs = getPickedMs();
    state.times = Array.from({length: state.n}, () => state.baseMs);
    state.names = Array.from({length: state.n}, (_, i) => `Игрок ${i+1}`);

    buildNamesEditor();
    buildLayout();
    renderAll();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
