<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Словесные часы</title>
  <style>
    :root{
      --bg:#070A14;
      --text:#F3F6FF;
      --muted:rgba(243,246,255,.72);
      --border:rgba(255,255,255,.12);
      --shadow: 0 14px 36px rgba(0,0,0,.45);
      --r: 18px;
      --topH: 76px;
      --bottomH: 102px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(800px 600px at 20% 10%, rgba(124,92,255,.20), transparent 60%),
        radial-gradient(900px 700px at 80% 30%, rgba(47,224,123,.12), transparent 60%),
        var(--bg);
      color:var(--text);
      -webkit-tap-highlight-color: transparent;
      font-weight: 900;
      overflow:auto;
    }

    .screen{
      position:fixed;
      inset:0;
      display:grid;
      grid-template-rows: var(--topH) 1fr var(--bottomH);
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
    }

    /* top */
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 12px;
      min-width:0;
    }
    .topLeft{min-width:0; display:flex; flex-direction:column; gap:6px;}
    .title{
      font-size:14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      letter-spacing:.2px;
    }
    .turnLine{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      min-width:0;
    }
    .turnPill{
      border:1px solid var(--border);
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      padding: 8px 10px;
      font-size:12px;
      font-weight: 950;
      white-space:nowrap;
      box-shadow: 0 10px 22px rgba(0,0,0,.25);
      flex:0 0 auto;
    }
    .hint{
      font-size:12px;
      color:var(--muted);
      font-weight: 900;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      min-width:0;
    }

    /* arena */
    .arena{ padding: 10px 12px; min-height:0; }

    /* Всегда 2 колонки, чтобы было как на скрине */
    .grid{
      height:100%;
      width:100%;
      display:grid;
      grid-template-columns: 1fr 1fr;
      grid-auto-rows: 1fr;
      gap:10px;
      min-height:0;
      --timeVw: 7.0vw;
    }
    .grid.n2{ grid-template-rows: 1fr 1fr; --timeVw: 9.6vw; }
    .grid.n3, .grid.n4{ grid-template-rows: 1fr 1fr; --timeVw: 7.2vw; }
    .grid.n5, .grid.n6{ grid-template-rows: 1fr 1fr 1fr; --timeVw: 6.1vw; }
    .grid.n7, .grid.n8{ grid-template-rows: 1fr 1fr 1fr 1fr; --timeVw: 5.6vw; }

    .player{
      border-radius: var(--r);
      border:1px solid rgba(255,255,255,.14);
      box-shadow: var(--shadow);
      overflow:hidden;
      cursor:pointer;
      user-select:none;
      position:relative;
      min-height:0;
      display:grid;
      place-items:center;
      transition: transform .12s ease, outline-color .12s ease, filter .12s ease, opacity .12s ease;
    }
    .player::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(140px 140px at 20% 15%, rgba(255,255,255,.28), transparent 60%),
        linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,0));
      mix-blend-mode: overlay;
      opacity:.60;
      pointer-events:none;
    }

    .inner{
      position:relative;
      padding: 10px;
      width:100%;
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:6px;
    }
    .name{
      font-size:12px;
      letter-spacing:.35px;
      text-transform:uppercase;
      opacity:.96;
      font-weight: 950;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 92%;
    }
    .time{
      font-variant-numeric: tabular-nums;
      font-weight: 950;
      letter-spacing:.6px;
      line-height:1;
      font-size: clamp(26px, var(--timeVw, 7vw), 66px);
    }
    .sub{
      font-size:12px;
      font-weight: 950;
      opacity:.92;
    }

    /* Чёткое выделение + затемнение остальных */
    .grid.hasActive .player{
      filter: brightness(.60) saturate(.65);
    }
    .grid.hasActive .player::after{
      content:"";
      position:absolute;
      inset:0;
      background: rgba(0,0,0,.35); /* “черным 50%” примерно */
      pointer-events:none;
    }
    .grid.hasActive .player.active{
      filter: none;
      transform: translateY(-1px);
      outline: 5px solid rgba(255,255,255,.75);
      outline-offset: -5px;
    }
    .grid.hasActive .player.active::after{
      background: rgba(0,0,0,0);
    }

    .player.lost{
      opacity:.75;
      cursor:not-allowed;
      filter: grayscale(.2) brightness(.55);
    }
    .player.lost::after{ background: rgba(0,0,0,.45) !important; }

    /* bottom controls */
    .bottom{
      padding: 8px 12px 12px;
      border-top: 1px solid rgba(255,255,255,.06);
      background: rgba(5,7,16,.40);
      backdrop-filter: blur(8px);
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .btnRow{display:flex; gap:8px; flex-wrap:wrap; align-items:center}

    .btn{
      appearance:none;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
      color: var(--text);
      padding:11px 12px;
      border-radius: 14px;
      cursor:pointer;
      font-weight: 950;
      line-height:1;
      white-space:nowrap;
      min-width: 108px;
      text-align:center;
    }
    .btn:disabled{opacity:.55; cursor:not-allowed}
    .btn.primary{
      background: linear-gradient(180deg, rgba(124,92,255,1), rgba(124,92,255,.72));
      border-color: rgba(124,92,255,.55);
    }
    .btn.danger{
      background: rgba(255,92,122,.14);
      border-color: rgba(255,92,122,.40);
    }
    .btn.ghost{
      min-width: 132px;
      background: rgba(255,255,255,.06);
    }
    .pill{
      border:1px solid var(--border);
      background: rgba(255,255,255,.06);
      border-radius: 999px;
      padding: 8px 10px;
      font-size:12px;
      font-weight: 950;
      white-space:nowrap;
    }

    /* Settings sheet: scroll внутри */
    .sheetOverlay{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.45);
      opacity:0;
      pointer-events:none;
      transition: opacity .18s ease;
    }
    .sheetOverlay.open{ opacity:1; pointer-events:auto; }

    .sheet{
      position:fixed;
      left:0; right:0;
      bottom:0;
      transform: translateY(105%);
      transition: transform .22s ease;
      padding:
        10px
        max(10px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(10px, env(safe-area-inset-left));
    }
    .sheet.open{ transform: translateY(0); }

    .sheetCard{
      border-radius: 20px;
      border:1px solid var(--border);
      background: rgba(10,14,28,.92);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      max-height: 78vh;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .sheetHandle{
      width:44px;
      height:5px;
      border-radius:999px;
      background: rgba(255,255,255,.25);
      margin: 10px auto 6px;
      flex:0 0 auto;
    }
    .sheetHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 8px 12px 10px;
      border-bottom:1px solid rgba(255,255,255,.08);
      flex:0 0 auto;
    }
    .sheetTitle{ font-size:14px; font-weight: 950; letter-spacing:.2px; }
    .sheetClose{ min-width: 96px; }

    .sheetBody{
      padding: 12px;
      overflow:auto;
      -webkit-overflow-scrolling: touch;
    }
    .sheetGrid{ display:grid; gap:12px; }
    .row{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      flex-wrap:wrap;
    }
    .label{ font-size:12px; font-weight: 950; color: var(--muted); }
    select, input[type="range"], input[type="text"]{
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.06);
      color: var(--text);
      padding:10px 10px;
      font-weight: 950;
      outline:none;
    }
    .timePick{display:flex; gap:8px; align-items:center}
    .counter{display:flex; gap:8px; align-items:center}
    .miniBtn{ min-width: 44px; padding: 10px 0; }

    .names{ display:grid; gap:10px; }
    .nameRow{
      display:grid;
      grid-template-columns: 1fr;
      gap:6px;
      padding: 10px;
      border:1px solid rgba(255,255,255,.10);
      border-radius: 16px;
      background: rgba(255,255,255,.04);
    }
    .note{
      color: var(--muted);
      font-size:12px;
      font-weight: 900;
      line-height:1.3;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div class="top">
      <div class="topLeft">
        <div class="title">Словесные часы</div>
        <div class="turnLine">
          <div class="turnPill" id="turnTop">Ход: —</div>
          <div class="hint" id="hintTop">⚙ Настройки → Старт → нажми игрока</div>
        </div>
      </div>
      <div class="turnPill" id="status">Готово</div>
    </div>

    <div class="arena">
      <div class="grid n2" id="grid"></div>
    </div>

    <div class="bottom">
      <div class="btnRow">
        <button class="btn primary" id="startBtn">Старт</button>
        <button class="btn" id="pauseBtn" disabled>Пауза</button>
        <button class="btn" id="resumeBtn" disabled>Продолжить</button>
        <button class="btn danger" id="resetBtn">Сброс</button>
      </div>
      <div class="btnRow">
        <div class="pill" id="turnBottom">Ход: —</div>
        <button class="btn ghost" id="settingsBtn">⚙ Настройки</button>
      </div>
    </div>
  </div>

  <!-- Settings sheet -->
  <div class="sheetOverlay" id="overlay"></div>
  <div class="sheet" id="sheet" aria-hidden="true">
    <div class="sheetCard" role="dialog" aria-modal="true">
      <div class="sheetHandle"></div>
      <div class="sheetHead">
        <div class="sheetTitle">Настройки</div>
        <button class="btn sheetClose" id="closeSettingsBtn">Закрыть</button>
      </div>

      <div class="sheetBody">
        <div class="sheetGrid">
          <div class="row">
            <div class="label">Время на игрока</div>
            <div class="timePick">
              <select id="mm"></select>
              <div class="label">:</div>
              <select id="ss"></select>
            </div>
          </div>

          <div class="row">
            <div class="label">Игроков</div>
            <div class="counter">
              <button class="btn miniBtn" id="minusBtn">−</button>
              <div class="pill"><b id="playersCount">2</b></div>
              <button class="btn miniBtn" id="plusBtn">+</button>
            </div>
          </div>

          <div class="row">
            <input id="playersRange" type="range" min="2" max="8" step="1" value="2" style="width:100%"/>
          </div>

          <div class="label">Имена игроков</div>
          <div class="names" id="namesBox"></div>

          <div class="note" id="settingsNote">
            Пока раунд не начат, можно менять время/игроков/имена. Во время раунда настройки заблокированы — нажми «Сброс».
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const pad2 = (n) => String(n).padStart(2, "0");
    const msToText = (ms) => {
      ms = Math.max(0, ms);
      const total = Math.ceil(ms / 1000);
      const m = Math.floor(total / 60);
      const s = total % 60;
      return `${pad2(m)}:${pad2(s)}`;
    };

    const COLORS = [
      { bg1:"#6D5CFF", bg2:"#4A33FF" },
      { bg1:"#2FE07B", bg2:"#16B85E" },
      { bg1:"#00C2FF", bg2:"#007CFF" },
      { bg1:"#FFB020", bg2:"#FF7A00" },
      { bg1:"#FF5C7A", bg2:"#E52B54" },
      { bg1:"#A855F7", bg2:"#6D28D9" },
      { bg1:"#22D3EE", bg2:"#0891B2" },
      { bg1:"#FDE047", bg2:"#F59E0B" },
    ];

    // ПОРЯДОК “ПО КРУГУ” ДЛЯ СЕТКИ 2 колонки:
    // Визуально: 1 (ЛВ) -> 2 (ПВ) -> 3 (под 2) -> 4 (под 3) -> 5 (под 4) -> 6 (слева от 5) -> 7 (над 6) -> 8 (над 7)
    // Индексы (0..n-1) в порядке хода:
    const SNAKE_ORDER_8 = [0,1,3,5,7,6,4,2]; // как на твоём описании (для 8)
    // Для n<8 используем первые n элементов этого маршрута.
    // Для n=2 будет [0,1], для n=3 [0,1,3] (мы корректно отфильтруем несуществующие).

    function buildTurnOrder(n){
      const max = Math.min(n, 8);
      const base = SNAKE_ORDER_8.filter(i => i < max);
      // Если n < 8, некоторые индексы (3,5...) могут не существовать.
      // Тогда делаем “змейку” универсально: по колонкам как обход по периметру в 2 столбца.
      if (base.length === n) return base;

      // Универсальная “змейка” для 2 колонок: сверху вниз правый столбец, потом снизу вверх левый.
      // Это очень близко к тому, что ты нарисовал как круг.
      const rows = Math.ceil(n/2);
      const right = [];
      const left = [];
      for (let r=0;r<rows;r++){
        const li = r*2;
        const ri = r*2 + 1;
        if (ri < n) right.push(ri);
        if (li < n) left.push(li);
      }
      return [left[0], ...right, ...left.slice(1).reverse()].filter(x => x !== undefined);
    }

    // DOM
    const grid = document.getElementById("grid");
    const hintTop = document.getElementById("hintTop");
    const statusEl = document.getElementById("status");
    const turnTop = document.getElementById("turnTop");
    const turnBottom = document.getElementById("turnBottom");

    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const resumeBtn = document.getElementById("resumeBtn");
    const resetBtn = document.getElementById("resetBtn");

    const settingsBtn = document.getElementById("settingsBtn");
    const closeSettingsBtn = document.getElementById("closeSettingsBtn");
    const overlay = document.getElementById("overlay");
    const sheet = document.getElementById("sheet");

    const mm = document.getElementById("mm");
    const ss = document.getElementById("ss");
    const minusBtn = document.getElementById("minusBtn");
    const plusBtn = document.getElementById("plusBtn");
    const playersRange = document.getElementById("playersRange");
    const playersCount = document.getElementById("playersCount");
    const namesBox = document.getElementById("namesBox");
    const settingsNote = document.getElementById("settingsNote");

    function fillSelect(select, max){
      select.innerHTML = "";
      for (let i=0;i<=max;i++){
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = pad2(i);
        select.appendChild(opt);
      }
    }
    fillSelect(mm, 59);
    fillSelect(ss, 59);

    const state = {
      n: 8,
      baseMs: 30_000,
      times: [],
      names: [],
      active: -1,
      started: false,
      running: false,
      paused: true,
      lastTs: 0,
      finished: new Set(),
      order: []
    };

    function getPickedMs(){
      const m = parseInt(mm.value, 10);
      const s = parseInt(ss.value, 10);
      let ms = (m*60 + s) * 1000;
      if (ms <= 0) ms = 30_000;
      return ms;
    }
    function setPicked(ms){
      const total = Math.round(ms / 1000);
      mm.value = String(Math.floor(total/60));
      ss.value = String(total%60);
    }

    function currentTurnName(){
      if (!state.running || state.paused || state.active < 0) return "—";
      return state.names[state.active] || `Игрок ${state.active+1}`;
    }

    function setStatusText(){
      if (!state.started){
        statusEl.textContent = "Готово";
        hintTop.textContent = "⚙ Настройки → Старт → нажми игрока (ход по кругу)";
      } else if (!state.running){
        statusEl.textContent = "Ожидание";
        hintTop.textContent = "Нажми игрока → ход перейдёт к следующему по кругу";
      } else if (state.paused){
        statusEl.textContent = "Пауза";
        hintTop.textContent = "Пауза";
      } else {
        statusEl.textContent = "Идёт";
        hintTop.textContent = "Нажми игрока → ход к следующему по кругу";
      }

      const turn = currentTurnName();
      turnTop.textContent = `Ход: ${turn}`;
      turnBottom.textContent = `Ход: ${turn}`;
    }

    function updateButtons(){
      startBtn.disabled = state.started;
      pauseBtn.disabled = !state.running || state.paused;
      resumeBtn.disabled = !state.running || !state.paused;
    }

    function updateSettingsLock(){
      const locked = state.started;
      mm.disabled = locked;
      ss.disabled = locked;
      minusBtn.disabled = locked;
      plusBtn.disabled = locked;
      playersRange.disabled = locked;
      [...namesBox.querySelectorAll("input")].forEach(inp => inp.disabled = locked);

      settingsNote.textContent = locked
        ? "Настройки заблокированы (раунд начат). Нажми «Сброс», чтобы снова менять."
        : "Можно менять время/игроков/имена. Нажми «Старт», затем нажми любого игрока.";
    }

    function gridClassForN(n){
      if (n === 2) return "n2";
      if (n === 3 || n === 4) return "n3";
      if (n === 5 || n === 6) return "n5";
      return "n7";
    }

    function buildNamesEditor(){
      namesBox.innerHTML = "";
      for (let i=0;i<state.n;i++){
        const row = document.createElement("div");
        row.className = "nameRow";

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = `Игрок ${i+1}`;

        const inp = document.createElement("input");
        inp.type = "text";
        inp.placeholder = `Имя игрока ${i+1}`;
        inp.value = state.names[i] ?? `Игрок ${i+1}`;
        inp.addEventListener("input", () => {
          state.names[i] = inp.value.trim() || `Игрок ${i+1}`;
          const nameEl = document.getElementById(`n-${i}`);
          if (nameEl) nameEl.textContent = state.names[i];
          setStatusText();
        });

        row.appendChild(label);
        row.appendChild(inp);
        namesBox.appendChild(row);
      }
    }

    function buildPlayers(){
      grid.innerHTML = "";
      grid.classList.remove("hasActive");
      grid.className = `grid ${gridClassForN(state.n)}`;

      state.order = buildTurnOrder(state.n);

      for (let i=0;i<state.n;i++){
        const c = COLORS[i % COLORS.length];

        const card = document.createElement("div");
        card.className = "player";
        card.dataset.i = String(i);
        card.style.background = `linear-gradient(180deg, ${c.bg1}, ${c.bg2})`;

        const inner = document.createElement("div");
        inner.className = "inner";

        const name = document.createElement("div");
        name.className = "name";
        name.id = `n-${i}`;
        name.textContent = state.names[i] ?? `Игрок ${i+1}`;

        const time = document.createElement("div");
        time.className = "time";
        time.id = `t-${i}`;
        time.textContent = msToText(state.times[i] ?? state.baseMs);

        const sub = document.createElement("div");
        sub.className = "sub";
        sub.id = `s-${i}`;
        sub.textContent = "Нажми";

        inner.appendChild(name);
        inner.appendChild(time);
        inner.appendChild(sub);
        card.appendChild(inner);

        card.addEventListener("click", () => onTap(i));
        grid.appendChild(card);
      }

      renderAll();
    }

    function renderAll(){
      const cards = [...grid.querySelectorAll(".player")];
      const hasActive = state.running && !state.paused && state.active >= 0;
      grid.classList.toggle("hasActive", hasActive);

      cards.forEach(el => {
        const i = parseInt(el.dataset.i, 10);
        el.classList.toggle("active", hasActive && i === state.active);
        el.classList.toggle("lost", state.finished.has(i));
      });

      for (let i=0;i<state.n;i++){
        const tEl = document.getElementById(`t-${i}`);
        if (tEl) tEl.textContent = msToText(state.times[i]);

        const sEl = document.getElementById(`s-${i}`);
        if (!sEl) continue;

        if (state.finished.has(i)) sEl.textContent = "Вышло";
        else if (!state.started) sEl.textContent = "После Старт";
        else if (!state.running) sEl.textContent = "Нажми → ход по кругу";
        else if (state.paused) sEl.textContent = "Пауза";
        else {
          const nm = state.names[state.active] ?? `Игрок ${state.active+1}`;
          sEl.textContent = (i === state.active) ? `Сейчас: ${nm}` : "Нажми → ход по кругу";
        }
      }

      playersCount.textContent = String(state.n);
      playersRange.value = String(state.n);

      setStatusText();
      updateButtons();
      updateSettingsLock();
    }

    function nextAliveByOrder(fromIndex){
      // fromIndex — текущий игрок, ищем следующего по state.order
      const order = state.order;
      const pos = order.indexOf(fromIndex);
      if (pos === -1) return fromIndex;

      for (let step=1; step<=order.length; step++){
        const cand = order[(pos + step) % order.length];
        if (!state.finished.has(cand)) return cand;
      }
      return fromIndex;
    }

    // Ход по кругу: нажал игрок i -> ход к следующему в order после i
    function onTap(i){
      if (!state.started) return;
      if (state.running && state.paused) return;
      if (state.finished.size >= state.n) return;

      const next = nextAliveByOrder(i);

      if (!state.running){
        state.running = true;
        state.paused = false;
        state.lastTs = performance.now();
      }

      state.active = next;
      renderAll();
    }

    function start(){
      if (state.started) return;

      state.baseMs = getPickedMs();
      state.times = Array.from({length: state.n}, () => state.baseMs);
      state.finished = new Set();
      state.active = -1;

      state.started = true;
      state.running = false;
      state.paused = true;
      state.lastTs = 0;

      renderAll();
    }

    function pause(){
      if (!state.running) return;
      state.paused = true;
      renderAll();
    }

    function resume(){
      if (!state.running) return;
      state.paused = false;
      state.lastTs = performance.now();
      renderAll();
    }

    function resetAll(){
      state.baseMs = getPickedMs();
      state.times = Array.from({length: state.n}, () => state.baseMs);
      state.finished = new Set();
      state.active = -1;

      state.started = false;
      state.running = false;
      state.paused = true;
      state.lastTs = 0;

      buildNamesEditor();
      buildPlayers();
      renderAll();
    }

    function setPlayersCount(n){
      if (state.started) return;
      state.n = Math.max(2, Math.min(8, n));
      state.baseMs = getPickedMs();
      state.times = Array.from({length: state.n}, () => state.baseMs);

      const newNames = [];
      for (let i=0;i<state.n;i++){
        newNames[i] = state.names[i] ?? `Игрок ${i+1}`;
      }
      state.names = newNames;

      buildNamesEditor();
      buildPlayers();
    }

    function addPlayer(){ setPlayersCount(state.n + 1); }
    function removePlayer(){ setPlayersCount(state.n - 1); }

    function onTimeChange(){
      if (state.started) return;
      state.baseMs = getPickedMs();
      state.times = Array.from({length: state.n}, () => state.baseMs);
      buildPlayers();
      renderAll();
    }

    function tick(ts){
      if (!state.running || state.paused || state.active < 0){
        state.lastTs = ts;
        requestAnimationFrame(tick);
        return;
      }

      const dt = ts - (state.lastTs || ts);
      state.lastTs = ts;

      if (!state.finished.has(state.active)){
        state.times[state.active] -= dt;

        if (state.times[state.active] <= 0){
          state.times[state.active] = 0;
          state.finished.add(state.active);

          if (state.finished.size < state.n){
            // если у текущего вышло время — по кругу к следующему живому
            state.active = nextAliveByOrder(state.active);
          }
          renderAll();
        } else {
          const tEl = document.getElementById(`t-${state.active}`);
          if (tEl) tEl.textContent = msToText(state.times[state.active]);
          setStatusText();
        }
      }

      requestAnimationFrame(tick);
    }

    // settings sheet
    function openSettings(){
      overlay.classList.add("open");
      sheet.classList.add("open");
      sheet.setAttribute("aria-hidden", "false");
      updateSettingsLock();
    }
    function closeSettings(){
      overlay.classList.remove("open");
      sheet.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
    }

    settingsBtn.addEventListener("click", openSettings);
    closeSettingsBtn.addEventListener("click", closeSettings);
    overlay.addEventListener("click", closeSettings);

    mm.addEventListener("change", onTimeChange);
    ss.addEventListener("change", onTimeChange);

    plusBtn.addEventListener("click", addPlayer);
    minusBtn.addEventListener("click", removePlayer);
    playersRange.addEventListener("input", () => setPlayersCount(parseInt(playersRange.value, 10)));

    startBtn.addEventListener("click", start);
    pauseBtn.addEventListener("click", pause);
    resumeBtn.addEventListener("click", resume);
    resetBtn.addEventListener("click", resetAll);

    // init
    setPicked(30_000);
    state.n = 8;
    state.baseMs = getPickedMs();
    state.times = Array.from({length: state.n}, () => state.baseMs);
    state.names = Array.from({length: state.n}, (_, i) => `Игрок ${i+1}`);

    buildNamesEditor();
    buildPlayers();
    renderAll();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
