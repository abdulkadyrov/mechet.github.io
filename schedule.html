<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Расписание намаза</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/themes.css">
</head>
<body>
<header class="header">
  <div class="container">
    <div class="nav">
      <a class="brand" href="/index.html">
        <div class="brand__logo" aria-hidden="true"></div>
        <div><div class="brand__name">Мечеть</div><span class="brand__sub">Вопросы • Опросы • Садака</span></div>
      </a>
      <nav class="nav__links">
        <a href="/questions.html">Вопрос Имаму</a>
        <a href="/polls.html">Опросы</a>
        <a href="/donations.html">Садака</a>
        <a href="/sermons.html">Проповеди</a>
        <a href="/schedule.html">Расписание</a>
        <a href="/contacts.html">Контакты</a>
        <a href="/admin/index.html">Админ</a>
      </nav>
      <button class="btn btn--ghost" data-nav-toggle>Меню</button>
    </div>
  </div>
</header>

<main class="main">
  <div class="container">
    <div class="section-title">
      <div>
        <h1>Расписание намаза</h1>
        <p>Актуальное расписание (фото на месяц). Загружается в админке.</p>
      </div>
      <a class="badge" href="/admin/schedule.html">Обновить →</a>
    </div>

    <section class="card">
      <div id="sch"></div>
    </section>
  </div>
</main>

<footer class="footer">
  <div class="container"><div class="small">© Прототип</div></div>
</footer>

<script type="module">
  import "./assets/js/app.js";
  import "./assets/js/mock-api/seed.js";
  import { KEYS, load } from "./assets/js/storage.js";
  import { setHTML, escapeHTML } from "./assets/js/ui.js";

  const sch = load(KEYS.schedule, null);
  const root = document.getElementById("sch");

  if(!sch){
    setHTML(root, `<div class="notice">Расписание не задано.</div>`);
  }else{
    setHTML(root, `
      <div class="item">
        <div class="item__top">
          <div>
            <div class="item__title">Расписание на: ${escapeHTML(sch.monthLabel || "")}</div>
            <div class="item__meta">Формат: фото</div>
          </div>
        </div>
        <div class="hr"></div>
        ${sch.imageUrl ? `<img src="${escapeHTML(sch.imageUrl)}" alt="Расписание" style="border-radius:14px;border:1px solid var(--border)">`
                       : `<div class="notice">Фото ещё не загружено (в прототипе укажите URL изображения в админке).</div>`}
      </div>
    `);
  }
</script>
</body>
</html>
